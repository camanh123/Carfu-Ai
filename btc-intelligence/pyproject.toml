[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-intelligence"
version = "0.1.0"
description = "BTC market intelligence and decision engine. NautilusTrader is pinned infrastructure and is not vendored."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "nautilus_trader==1.231.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q -m 'not integration'"
markers = [
    "integration: live public market-data tests; excluded by default",
]
