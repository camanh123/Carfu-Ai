syntax = "proto3";

import "theme.proto";
import "language.proto";
import "input_device.proto";
import "speech_output_device.proto";
import "wake_device.proto";
import "stt_play_sound.proto";
import "command_recognition_engine.proto";

option java_package = "org.stypox.dicio.settings.datastore";
option java_multiple_files = true;

message UserSettings {
    Theme theme = 1;
    bool dynamic_colors = 2;
    Language language = 3;
    InputDevice input_device = 4;
    SpeechOutputDevice speech_output_device = 5;
    bool auto_finish_stt_popup = 6;
    map<string, bool> enabled_skills = 7;
    WakeDevice wake_device = 8;
    SttPlaySound stt_play_sound = 9;
    int32 stt_silence_duration = 10;
    // Acceptance build default is OFF: only explicit ENABLED starts
    // background wake. UNSET is treated as OFF so this APK does not keep
    // a false-wake session from older installs. MODE still works.
    BackgroundWake background_wake = 11;
    // Default command STT is Android/Google SpeechRecognizer (vi-VN).
    // UNSET and UNRECOGNIZED resolve to ANDROID_ONLINE. VOSK_LEGACY is
    // an explicit offline fallback, not a silent substitute.
    CommandRecognitionEngine command_recognition_engine = 12;
}

enum BackgroundWake {
    BACKGROUND_WAKE_UNSET = 0;
    BACKGROUND_WAKE_ENABLED = 1;
    BACKGROUND_WAKE_DISABLED = 2;
}
